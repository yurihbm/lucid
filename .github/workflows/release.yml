name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: xcode-27
    # Only v* tags may deploy to this environment; it holds HOMEBREW_TAP_TOKEN.
    environment: main
    permissions:
      contents: write

    steps:
      - uses: yurihbm/homebrew-app-release/release@v0.1.0
        with:
          project: Lucid.xcodeproj
          scheme: Lucid
          cask: lucid
          tap-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
