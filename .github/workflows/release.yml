name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: xcode-27
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Archive
        run: xcodebuild -project Lucid.xcodeproj -scheme Lucid -configuration Release -archivePath build/Lucid.xcarchive CODE_SIGNING_ALLOWED=NO archive

      - name: Zip .app
        run: ditto -c -k --sequesterRsrc --keepParent build/Lucid.xcarchive/Products/Applications/Lucid.app Lucid.zip

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: Lucid.zip
          generate_release_notes: true
